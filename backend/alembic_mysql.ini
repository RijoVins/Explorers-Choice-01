# Alembic configuration for the MySQL provider.
#
# The URL is intentionally left blank: app/migrations_mysql/env.py takes it
# from the resolved database provider, so migrations can never run against a
# different database than the application.
#
# Apply explicitly (never at startup):
#   python -m alembic -c alembic_mysql.ini upgrade head
#
# The PostgreSQL schema uses the default alembic.ini instead:
#   python -m alembic upgrade head

[alembic]
script_location = app/migrations_mysql
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
